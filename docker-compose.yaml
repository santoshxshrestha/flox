version: "3"

services:
  db:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: supersecret
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://app_user:supersecret@db:5432/app_db
      RUST_LOG: info
    ports:
      - "8080:8080"
